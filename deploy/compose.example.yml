services:
  stackarr:
    build:
      context: ..
    image: stackarr:local
    container_name: stackarr
    restart: unless-stopped
    ports:
      - "${STACKARR_PORT:-4687}:4687"
    environment:
      STACKARR_PORT: "4687"
      STACKARR_DATA_DIR: /app/data
      STACKARR_LOG_LEVEL: ${STACKARR_LOG_LEVEL:-info}
    volumes:
      - ${STACKARR_DATA_DIR:-../data}:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      # Keep host paths identical inside the container so detection, validation,
      # Compose generation, and backups all use the same absolute paths.
      - ${HOST_STACK_ROOT}:${HOST_STACK_ROOT}
      - ${HOST_CONFIG_ROOT}:${HOST_CONFIG_ROOT}
      - ${HOST_MEDIA_ROOT}:${HOST_MEDIA_ROOT}
      - ${HOST_DOWNLOADS_ROOT}:${HOST_DOWNLOADS_ROOT}
      # Remove this line if Plex logs are not available on the host.
      - ${HOST_PLEX_LOGS_ROOT}:${HOST_PLEX_LOGS_ROOT}:ro
    # No networks are declared here on purpose. The controller creates the
    # shared `stackarr` network and joins itself to it at startup, so a brand
    # new host needs nothing set up beforehand.
    #
    # Declaring it here instead does not work: QNAP's Container Station fails
    # to create a Compose-owned bridge network ("dnsmasq add fail"), while a
    # plain `docker network create` succeeds — which is the call the controller
    # makes. Declaring it `external` would be worse still, since the very first
    # `compose up` on a clean host would fail before Stackarr ever runs.
